<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaVidhya - YouTube App</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent-color: #ff6b6b;
            --header-bg: #ffffff;
        }

        body.dark-mode {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --header-bg: #1e1e1e;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        .header {
            flex-shrink: 0;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-primary);
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .btn-icon:active {
            background-color: var(--bg-secondary);
        }

        .back-button {
            color: var(--accent-color);
            font-size: 24px;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .screen {
            display: none;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen.active {
            display: block;
        }

        .home-screen {
            padding: 16px;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .video-card {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-secondary);
            transition: transform 0.15s;
        }

        .video-card:active {
            transform: scale(0.95);
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-icon {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: rgba(255, 107, 107, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .video-info {
            padding: 8px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .player-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .player-container {
            flex-shrink: 0;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
        }

        #ytPlayer {
            width: 100%;
            height: 100%;
        }

        .video-details {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        .video-title-large {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .captions-box {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        .caption-text {
            font-size: 15px;
            line-height: 1.6;
            text-align: center;
            word-wrap: break-word;
        }

        .caption-counter {
            font-size: 12px;
            color: var(--text-secondary);
            text-align: center;
            margin-top: 8px;
        }

        .admin-screen {
            padding: 16px;
        }

        .form-section {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-section h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-danger {
            background-color: #ff4757;
            color: white;
        }

        .video-item {
            background-color: var(--bg-primary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .video-item-title {
            flex: 1;
            font-size: 13px;
        }

        .video-item-actions {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-edit {
            background-color: #3498db;
            color: white;
        }

        .btn-delete {
            background-color: #e74c3c;
            color: white;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 200;
            justify-content: center;
            align-items: flex-end;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-primary);
            width: 100%;
            max-height: 80vh;
            border-radius: 16px 16px 0 0;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
        }

        .modal-header h2 {
            font-size: 16px;
        }

        .modal-body {
            padding: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            border-radius: 28px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--accent-color);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(22px);
        }

        .password-modal {
            display: none; /* By default hidden, controlled via .active */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 300;
            justify-content: center;
            align-items: center;
        }

        .password-modal.active {
            display: flex;
        }

        .password-box {
            background-color: var(--bg-secondary);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 300px;
            text-align: center;
        }

        .password-box h2 {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .password-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }

        .password-error {
            color: #ff4757;
            font-size: 12px;
            margin-bottom: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="width: 40px; display: flex; align-items: center;">
            <button class="btn-icon back-button" id="backBtn" style="display: none;">←</button>
        </div>
        <div class="header-title" id="headerTitle">ParaVidhya</div>
        <div class="header-controls">
            <button class="btn-icon" id="darkModeBtn">🌙</button>
            <button class="btn-icon" id="settingsBtn">⚙️</button>
        </div>
    </div>

    <div class="content">
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div id="videosList" class="videos-grid"></div>
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">🎬</div>
                    <p>कोई वीडियो नहीं</p>
                </div>
            </div>
        </div>

        <div class="screen" id="playerScreen">
            <div class="player-screen">
                <div class="player-container">
                    <div id="ytPlayer"></div>
                </div>
                <div class="video-details">
                    <div class="video-title-large" id="playerTitle">लोड हो रहा है...</div>
                    <div class="captions-box">
                        <div>
                            <div class="caption-text" id="captionText">कैप्शन यहाँ दिखेंगे...</div>
                            <div class="caption-counter" id="captionCounter"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="screen" id="adminScreen">
            <div class="admin-screen">
                <div id="adminMsg"></div>

                <div class="form-section">
                    <h3 id="formTitle">नया वीडियो जोड़ें</h3>
                    <div class="form-group">
                        <label>शीर्षक</label>
                        <input type="text" id="videoTitle" placeholder="शीर्षक">
                    </div>
                    <div class="form-group">
                        <label>YouTube URL</label>
                        <input type="text" id="youtubeUrl" placeholder="https://youtu.be/...">
                    </div>
                    <div class="form-group">
                        <label>कैप्शन फ़ाइल (JSON)</label>
                        <input type="file" id="captionsFile" accept=".json">
                        <small style="color:var(--text-secondary); font-size:12px; display:block; margin-top:4px;"> प्रारूप: [[start, end, "text"], ...]</small>
                    </div>
                    <button class="btn-primary" id="submitBtn">जोड़ें</button>
                    <button class="btn-secondary btn-danger" id="cancelBtn" style="display: none;">रद्द करें</button>
                </div>

                <div class="form-section">
                    <h3>वीडियो</h3>
                    <div id="videosList2"></div>
                    <div id="emptyVideos" class="empty-state" style="display: none;">
                        <p>कोई वीडियो नहीं</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>सेटिंग्स</h2>
                <button class="close-btn" id="closeSettings">✕</button>
            </div>
            <div class="modal-body">
                <div class="toggle-item">
                    <label>डार्क मोड</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="darkToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="form-group" style="margin-top: 16px;">
                    <button class="btn-primary" id="adminBtn">एडमिन पैनल</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Password Modal Fixed -->
    <div class="password-modal" id="passwordModal">
        <div class="password-box">
            <h2>एडमिन पैनल</h2>
            <input type="password" id="passwordInput" class="password-input" placeholder="पासवर्ड" autocomplete="current-password">
            <div class="password-error" id="passError"></div>
            <button class="btn-primary" id="passBtn">लॉगिन</button>
            <button class="btn-secondary" id="passCloseBtn" style="margin-top: 8px;">रद्द करें</button>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGHJR74q0Xfj4QQz8uc36Qyb0kBlAI384",
            authDomain: "paravidhya-ki-paathshala.firebaseapp.com",
            projectId: "paravidhya-ki-paathshala",
            storageBucket: "paravidhya-ki-paathshala.firebasestorage.app",
            messagingSenderId: "69366852667",
            appId: "1:69366852667:web:9744c3592ced1f5508801e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const state = {
            videos: [],
            currentVideo: null,
            isAdminLoggedIn: false,
            editingId: null,
            isDarkMode: localStorage.getItem('darkMode') === 'true',
            captionsData: null,
            player: null,
            updateInterval: null
        };

        function init() {
            setupEvents();
            loadDarkMode();
            loadVideos();
        }

        function setupEvents() {
            document.getElementById('backBtn').addEventListener('click', goHome);
            document.getElementById('darkModeBtn').addEventListener('click', toggleDarkMode);
            document.getElementById('darkToggle').addEventListener('change', toggleDarkMode);
            document.getElementById('settingsBtn').addEventListener('click', () => openModal('settingsModal'));
            document.getElementById('closeSettings').addEventListener('click', () => closeModal('settingsModal'));
            document.getElementById('adminBtn').addEventListener('click', openAdminPanel);
            
            // Password events fix
            document.getElementById('passBtn').addEventListener('click', checkPassword);
            document.getElementById('passCloseBtn').addEventListener('click', () => {
                document.getElementById('passwordModal').classList.remove('active');
            });
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') checkPassword();
            });

            document.getElementById('submitBtn').addEventListener('click', saveVideo);
            document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
            document.getElementById('captionsFile').addEventListener('change', handleFileUpload);
        }

        function toggleDarkMode() {
            state.isDarkMode = !state.isDarkMode;
            localStorage.setItem('darkMode', state.isDarkMode);
            loadDarkMode();
        }

        function loadDarkMode() {
            if (state.isDarkMode) {
                document.body.classList.add('dark-mode');
                document.getElementById('darkToggle').checked = true;
                document.getElementById('darkModeBtn').textContent = '☀️';
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('darkToggle').checked = false;
                document.getElementById('darkModeBtn').textContent = '🌙';
            }
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');

            const backBtn = document.getElementById('backBtn');
            const headerTitle = document.getElementById('headerTitle');

            if (screenId === 'homeScreen') {
                backBtn.style.display = 'none';
                headerTitle.textContent = 'ParaVidhya';
                stopCaptions();
                if (state.player && typeof state.player.stopVideo === 'function') {
                    state.player.stopVideo();
                }
            } else {
                backBtn.style.display = 'flex';
                headerTitle.textContent = screenId === 'playerScreen' ? 'वीडियो' : 'एडमिन';
            }
        }

        function goHome() {
            showScreen('homeScreen');
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.add('active');
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.classList.remove('active');
        }

        function openAdminPanel() {
            closeModal('settingsModal');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passError').textContent = '';
            
            // Direct activation for password modal
            document.getElementById('passwordModal').classList.add('active');
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        function checkPassword() {
            const pass = document.getElementById('passwordInput').value.trim();
            const errorEl = document.getElementById('passError');
            
            if (pass === '1234') {
                state.isAdminLoggedIn = true;
                document.getElementById('passwordInput').value = '';
                errorEl.textContent = '';
                document.getElementById('passwordModal').classList.remove('active');
                
                setTimeout(() => {
                    loadAdminVideos();
                    showScreen('adminScreen');
                }, 100);
            } else {
                errorEl.textContent = 'गलत पासवर्ड! (सही: 1234)';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    state.captionsData = JSON.parse(evt.target.result);
                    showMsg(`${state.captionsData.length} कैप्शन लोड किए गए`, 'success', 'adminMsg');
                } catch {
                    showMsg('अमान्य JSON फ़ाइल', 'error', 'adminMsg');
                    state.captionsData = null;
                }
            };
            reader.readAsText(file);
        }

        function saveVideo() {
            const title = document.getElementById('videoTitle').value.trim();
            const url = document.getElementById('youtubeUrl').value.trim();

            if (!title || !url) {
                showMsg('सभी फ़ील्ड भरना अनिवार्य है', 'error', 'adminMsg');
                return;
            }

            const videoId = extractVideoId(url);
            if (!videoId) {
                showMsg('अमान्य YouTube URL', 'error', 'adminMsg');
                return;
            }

            if (!state.editingId && !state.captionsData) {
                showMsg('कृपया कैप्शन फ़ाइल (JSON) अपलोड करें', 'error', 'adminMsg');
                return;
            }

            const data = {
                title,
                youtubeUrl: url,
                videoId,
                captions: state.captionsData || (state.videos.find(v => v.id === state.editingId)?.captions || []),
                thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
            };

            if (state.editingId) {
                db.ref(`videos/${state.editingId}`).update(data).then(() => {
                    showMsg('वीडियो अपडेट हो गया', 'success', 'adminMsg');
                    resetForm();
                    loadVideos();
                    loadAdminVideos();
                });
            } else {
                db.ref('videos').push().set(data).then(() => {
                    showMsg('नया वीडियो जोड़ा गया', 'success', 'adminMsg');
                    resetForm();
                    loadVideos();
                    loadAdminVideos();
                });
            }
        }

        function editVideo(id) {
            const video = state.videos.find(v => v.id === id);
            if (!video) return;
            state.editingId = id;
            document.getElementById('formTitle').textContent = 'वीडियो संपादित करें';
            document.getElementById('videoTitle').value = video.title;
            document.getElementById('youtubeUrl').value = video.youtubeUrl;
            document.getElementById('submitBtn').textContent = 'अपडेट करें';
            document.getElementById('cancelBtn').style.display = 'block';
        }

        function deleteVideo(id) {
            if (confirm('क्या आप वाकई इस वीडियो को हटाना चाहते हैं?')) {
                db.ref(`videos/${id}`).remove().then(() => {
                    loadVideos();
                    loadAdminVideos();
                });
            }
        }

        function cancelEdit() {
            resetForm();
        }

        function resetForm() {
            state.editingId = null;
            document.getElementById('formTitle').textContent = 'नया वीडियो जोड़ें';
            document.getElementById('videoTitle').value = '';
            document.getElementById('youtubeUrl').value = '';
            document.getElementById('captionsFile').value = '';
            document.getElementById('submitBtn').textContent = 'जोड़ें';
            document.getElementById('cancelBtn').style.display = 'none';
            state.captionsData = null;
        }

        function loadVideos() {
            db.ref('videos').once('value', snapshot => {
                state.videos = [];
                snapshot.forEach(child => {
                    state.videos.push({ id: child.key, ...child.val() });
                });
                renderVideos();
            });
        }

        function loadAdminVideos() {
            const list = document.getElementById('videosList2');
            const empty = document.getElementById('emptyVideos');
            
            if (state.videos.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = state.videos.map(v => `
                <div class="video-item">
                    <div class="video-item-title">${v.title}</div>
                    <div class="video-item-actions">
                        <button class="btn-small btn-edit" onclick="editVideo('${v.id}')">संपादित करें</button>
                        <button class="btn-small btn-delete" onclick="deleteVideo('${v.id}')">हटाएं</button>
                    </div>
                </div>
            `).join('');
        }

        function renderVideos() {
            const list = document.getElementById('videosList');
            const empty = document.getElementById('emptyState');

            if (state.videos.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = state.videos.map(v => `
                <div class="video-card" onclick="playVideo('${v.id}')">
                    <div class="video-thumbnail">
                        <img src="${v.thumbnail}" alt="${v.title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%23333%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2250%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2224%22%3E🎬%3C/text%3E%3C/svg%3E'">
                        <div class="play-icon">▶</div>
                    </div>
                    <div class="video-info">
                        <div class="video-title">${v.title}</div>
                    </div>
                </div>
            `).join('');
        }

        function playVideo(id) {
            const video = state.videos.find(v => v.id === id);
            if (!video) return;

            state.currentVideo = video;
            document.getElementById('playerTitle').textContent = video.title;
            document.getElementById('captionText').textContent = 'कैप्शन सिंक हो रहे हैं...';
            document.getElementById('captionCounter').textContent = '';

            showScreen('playerScreen');

            if (state.player && typeof state.player.loadVideoById === 'function') {
                state.player.loadVideoById(video.videoId);
            } else {
                initYouTubePlayer(video.videoId);
            }
        }

        function initYouTubePlayer(videoId) {
            if (window.YT && window.YT.Player) {
                state.player = new YT.Player('ytPlayer', {
                    videoId: videoId,
                    playerVars: { 'autoplay': 1, 'playsinline': 1 },
                    events: {
                        'onReady': (event) => {
                            event.target.playVideo();
                            startCaptions();
                        },
                        'onStateChange': (event) => {
                            if (event.data == YT.PlayerState.PLAYING) {
                                startCaptions();
                            } else {
                                stopCaptions();
                            }
                        }
                    }
                });
            } else {
                setTimeout(() => initYouTubePlayer(videoId), 500);
            }
        }

        function startCaptions() {
            stopCaptions();
            state.updateInterval = setInterval(updateCaptions, 200);
        }

        function updateCaptions() {
            if (!state.currentVideo || !state.currentVideo.captions || !state.player || typeof state.player.getCurrentTime !== 'function') {
                return;
            }

            try {
                const currentTime = state.player.getCurrentTime();
                const captions = state.currentVideo.captions;
                const captionEl = document.getElementById('captionText');
                const counterEl = document.getElementById('captionCounter');

                let activeIndex = -1;
                for (let i = 0; i < captions.length; i++) {
                    if (currentTime >= captions[i][0] && currentTime <= captions[i][1]) {
                        activeIndex = i;
                        break;
                    }
                }

                if (activeIndex !== -1) {
                    captionEl.textContent = captions[activeIndex][2];
                    counterEl.textContent = `${activeIndex + 1} / ${captions.length}`;
                } else {
                    captionEl.textContent = '...';
                    counterEl.textContent = '';
                }
            } catch (e) {
                console.error(e);
            }
        }

        function stopCaptions() {
            if (state.updateInterval) {
                clearInterval(state.updateInterval);
                state.updateInterval = null;
            }
        }

        function extractVideoId(url) {
            try {
                const u = new URL(url);
                return u.hostname.includes('youtu.be') 
                    ? u.pathname.substring(1).split('?')[0]
                    : u.searchParams.get('v');
            } catch {
                return null;
            }
        }

        function showMsg(msg, type, el) {
            const msgEl = document.getElementById(el);
            msgEl.innerHTML = `<div class="message ${type}">${msg}</div>`;
            setTimeout(() => msgEl.innerHTML = '', 3000);
        }

        init();
    </script>
</body>
</html>
