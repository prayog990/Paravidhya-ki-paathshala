<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParaVidhya - YouTube App</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100%;
            overflow: hidden;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --accent-color: #ff6b6b;
        }

        body.dark-mode {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
        }

        body {
            display: flex;
            flex-direction: column;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            flex-shrink: 0;
            background-color: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 56px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
        }

        .header-controls {
            display: flex;
            gap: 12px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
            -webkit-user-select: none;
            user-select: none;
        }

        .btn-icon:active {
            background-color: var(--bg-secondary);
        }

        .content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .screen {
            display: none;
            padding: 16px;
        }

        .screen.active {
            display: block;
        }

        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .video-card {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--bg-secondary);
            transition: transform 0.15s;
        }

        .video-card:active {
            transform: scale(0.95);
        }

        .video-thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            position: relative;
        }

        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-icon {
            position: absolute;
            width: 45px;
            height: 45px;
            background-color: rgba(255, 107, 107, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }

        .video-info {
            padding: 8px;
        }

        .video-title {
            font-size: 13px;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            gap: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .error-state {
            text-align: center;
            padding: 40px 20px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .error-msg {
            color: #ff4757;
            margin-bottom: 16px;
            font-size: 14px;
        }

        .btn-primary {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .player-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 0;
        }

        .player-container {
            flex-shrink: 0;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
        }

        .player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: none;
            font-size: 24px;
            color: var(--accent-color);
            cursor: pointer;
        }

        .back-btn.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-primary);
            width: 100%;
            max-height: 80vh;
            border-radius: 16px 16px 0 0;
            overflow-y: auto;
            padding: 20px;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 16px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-primary);
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            border-radius: 28px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: var(--accent-color);
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(22px);
        }

        .password-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .password-overlay.active {
            display: flex;
        }

        .password-box {
            background-color: var(--bg-primary);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 320px;
            text-align: center;
        }

        .password-box h2 {
            margin-bottom: 20px;
            font-size: 16px;
        }

        .password-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            letter-spacing: 2px;
        }

        .password-error {
            color: #ff4757;
            font-size: 12px;
            margin-bottom: 12px;
            min-height: 18px;
        }

        /* Admin Panel */
        .form-section {
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .form-section h3 {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group small {
            display: block;
            margin-top: 6px;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .btn-secondary {
            width: 100%;
            padding: 10px;
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn-danger {
            background-color: #ff4757;
        }

        .video-item {
            background-color: var(--bg-primary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .video-item-title {
            flex: 1;
            font-size: 13px;
        }

        .video-item-actions {
            display: flex;
            gap: 6px;
        }

        .btn-small {
            padding: 6px 10px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            color: white;
        }

        .btn-edit {
            background-color: #3498db;
        }

        .btn-delete {
            background-color: #e74c3c;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" id="backBtn">←</button>
        <div class="header-title" id="headerTitle">ParaVidhya</div>
        <div class="header-controls">
            <button class="btn-icon" id="darkModeBtn" type="button">🌙</button>
            <button class="btn-icon" id="settingsBtn" type="button">⚙️</button>
        </div>
    </div>

    <div class="content">
        <!-- Home Screen -->
        <div class="screen active" id="homeScreen">
            <div id="videosList" class="videos-grid"></div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <div class="empty-icon">🎬</div>
                <p>कोई वीडियो नहीं</p>
            </div>
            <div id="loadingState" class="loading-state" style="display: none;">
                <div class="spinner"></div>
                <div class="loading-text">लोड हो रहा है...</div>
            </div>
            <div id="errorState" class="error-state" style="display: none;">
                <div class="error-icon">⚠️</div>
                <div class="error-msg" id="errorMsg">कनेक्शन त्रुटि</div>
                <button class="btn-primary" onclick="app.loadVideos()">फिर से कोशिश करें</button>
            </div>
        </div>

        <!-- Player Screen -->
        <div class="screen" id="playerScreen" class="player-screen">
            <div class="player-container">
                <iframe id="ytPlayer" frameborder="0" allow="autoplay" allowfullscreen></iframe>
            </div>
            <div style="flex: 1; overflow-y: auto; padding: 16px;">
                <div id="playerTitle" style="font-size: 16px; font-weight: 600; margin-bottom: 12px;">लोड हो रहा है...</div>
                <div style="background-color: var(--bg-secondary); border-radius: 8px; padding: 16px; text-align: center;">
                    कैप्शन यहाँ दिखेंगे...
                </div>
            </div>
        </div>

        <!-- Admin Screen -->
        <div class="screen" id="adminScreen">
            <div id="adminMsg"></div>

            <div class="form-section">
                <h3 id="formTitle">नया वीडियो जोड़ें</h3>
                
                <div class="form-group">
                    <label>वीडियो शीर्षक</label>
                    <input type="text" id="videoTitle" placeholder="शीर्षक दर्ज करें">
                </div>

                <div class="form-group">
                    <label>YouTube URL</label>
                    <input type="text" id="youtubeUrl" placeholder="https://youtu.be/...">
                    <small>शॉर्ट या फुल URL दोनों काम करेंगे</small>
                </div>

                <div class="form-group">
                    <label>कैप्शन फ़ाइल (JSON)</label>
                    <input type="file" id="captionsFile" accept=".json">
                    <small>प्रारूप: [[start, end, "text"], ...]</small>
                </div>

                <div id="fileStatus" style="color: var(--text-secondary); font-size: 13px; margin-top: 8px;"></div>

                <button class="btn-primary" id="submitBtn" style="width: 100%; margin-top: 12px;">वीडियो जोड़ें</button>
                <button class="btn-secondary btn-danger" id="cancelBtn" style="display: none;">रद्द करें</button>
            </div>

            <div class="form-section">
                <h3>सभी वीडियो</h3>
                <div id="videosList2"></div>
                <div id="emptyVideos" class="empty-state" style="display: none; padding: 20px;">
                    <p>कोई वीडियो नहीं</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>सेटिंग्स</h2>
                <button class="close-btn" id="closeSettingsBtn" type="button">✕</button>
            </div>
            <div class="toggle-item">
                <label>डार्क मोड</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="darkToggle">
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <button class="btn-primary" id="adminBtn" type="button" style="width: 100%; margin-top: 16px;">एडमिन पैनल खोलें</button>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <h2>एडमिन पैनल</h2>
            <input type="password" id="passwordInput" class="password-input" placeholder="पासवर्ड" autocomplete="off">
            <div class="password-error" id="passError"></div>
            <button class="btn-primary" id="passBtn" type="button" style="width: 100%;">लॉगिन करें</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCGHJR74q0Xfj4QQz8uc36Qyb0kBlAI384",
            authDomain: "paravidhya-ki-paathshala.firebaseapp.com",
            projectId: "paravidhya-ki-paathshala",
            storageBucket: "paravidhya-ki-paathshala.firebasestorage.app",
            messagingSenderId: "69366852667",
            appId: "1:69366852667:web:9744c3592ced1f5508801e"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const app = {
            videos: [],
            isDarkMode: localStorage.getItem('darkMode') === 'true',
            captionsData: null,
            editingId: null,
            loadTimeout: null,
            
            init() {
                this.setupEvents();
                this.loadDarkMode();
                this.loadVideos();
            },

            setupEvents() {
                document.getElementById('darkModeBtn').addEventListener('click', () => this.toggleDarkMode());
                document.getElementById('darkToggle').addEventListener('change', () => this.toggleDarkMode());
                document.getElementById('settingsBtn').addEventListener('click', () => this.openSettings());
                document.getElementById('closeSettingsBtn').addEventListener('click', () => this.closeSettings());
                document.getElementById('adminBtn').addEventListener('click', () => this.openPasswordModal());
                document.getElementById('passBtn').addEventListener('click', () => this.checkPassword());
                document.getElementById('backBtn').addEventListener('click', () => this.goHome());
                document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkPassword();
                });
                document.getElementById('submitBtn').addEventListener('click', () => this.saveVideo());
                document.getElementById('cancelBtn').addEventListener('click', () => this.cancelEdit());
                document.getElementById('captionsFile').addEventListener('change', (e) => this.handleFileUpload(e));
            },

            toggleDarkMode() {
                this.isDarkMode = !this.isDarkMode;
                localStorage.setItem('darkMode', this.isDarkMode);
                this.loadDarkMode();
            },

            loadDarkMode() {
                if (this.isDarkMode) {
                    document.body.classList.add('dark-mode');
                    document.getElementById('darkToggle').checked = true;
                    document.getElementById('darkModeBtn').textContent = '☀️';
                } else {
                    document.body.classList.remove('dark-mode');
                    document.getElementById('darkToggle').checked = false;
                    document.getElementById('darkModeBtn').textContent = '🌙';
                }
            },

            showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');

                const backBtn = document.getElementById('backBtn');
                if (screenId === 'homeScreen') {
                    backBtn.classList.remove('show');
                    document.getElementById('headerTitle').textContent = 'ParaVidhya';
                } else {
                    backBtn.classList.add('show');
                    document.getElementById('headerTitle').textContent = screenId === 'playerScreen' ? 'वीडियो' : 'एडमिन';
                }
            },

            goHome() {
                this.showScreen('homeScreen');
            },

            openSettings() {
                document.getElementById('settingsModal').classList.add('active');
            },

            closeSettings() {
                document.getElementById('settingsModal').classList.remove('active');
            },

            openPasswordModal() {
                this.closeSettings();
                document.getElementById('passwordOverlay').classList.add('active');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passError').textContent = '';
                setTimeout(() => document.getElementById('passwordInput').focus(), 100);
            },

            checkPassword() {
                const pass = document.getElementById('passwordInput').value;
                if (pass === '1234') {
                    document.getElementById('passwordOverlay').classList.remove('active');
                    this.showAdminPanel();
                    this.showScreen('adminScreen');
                } else {
                    document.getElementById('passError').textContent = 'गलत पासवर्ड';
                    document.getElementById('passwordInput').value = '';
                }
            },

            showAdminPanel() {
                this.loadAdminVideos();
                this.resetForm();
            },

            handleFileUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        this.captionsData = JSON.parse(evt.target.result);
                        const count = this.captionsData.length;
                        document.getElementById('fileStatus').textContent = `✅ ${count} कैप्शन लोड हो गए`;
                    } catch (error) {
                        document.getElementById('fileStatus').textContent = '❌ JSON अमान्य है';
                        this.captionsData = null;
                    }
                };
                reader.readAsText(file);
            },

            saveVideo() {
                const title = document.getElementById('videoTitle').value.trim();
                const url = document.getElementById('youtubeUrl').value.trim();

                if (!title || !url) {
                    this.showMsg('सभी फ़ील्ड भरें', 'error');
                    return;
                }

                const videoId = this.extractVideoId(url);
                if (!videoId) {
                    this.showMsg('अमान्य YouTube URL', 'error');
                    return;
                }

                if (!this.editingId && !this.captionsData) {
                    this.showMsg('कैप्शन फ़ाइल अपलोड करें', 'error');
                    return;
                }

                const data = {
                    title,
                    youtubeUrl: url,
                    videoId,
                    captions: this.captionsData || (this.videos.find(v => v.id === this.editingId)?.captions || []),
                    thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
                };

                if (this.editingId) {
                    db.ref(`videos/${this.editingId}`).update(data).then(() => {
                        this.showMsg('✅ वीडियो अपडेट हो गया', 'success');
                        this.resetForm();
                        this.loadVideos();
                        this.loadAdminVideos();
                    }).catch(error => {
                        this.showMsg('❌ Error', 'error');
                    });
                } else {
                    db.ref('videos').push().set(data).then(() => {
                        this.showMsg('✅ वीडियो जोड़ा गया', 'success');
                        this.resetForm();
                        this.loadVideos();
                        this.loadAdminVideos();
                    }).catch(error => {
                        this.showMsg('❌ Error', 'error');
                    });
                }
            },

            editVideo(id) {
                const video = this.videos.find(v => v.id === id);
                if (!video) return;
                
                this.editingId = id;
                document.getElementById('formTitle').textContent = 'वीडियो संपादित करें';
                document.getElementById('videoTitle').value = video.title;
                document.getElementById('youtubeUrl').value = video.youtubeUrl;
                document.getElementById('submitBtn').textContent = 'अपडेट करें';
                document.getElementById('cancelBtn').style.display = 'block';
            },

            deleteVideo(id) {
                if (!confirm('क्या आप यह वीडियो हटाना चाहते हैं?')) return;
                
                db.ref(`videos/${id}`).remove().then(() => {
                    this.showMsg('✅ वीडियो हटा दिया गया', 'success');
                    this.loadVideos();
                    this.loadAdminVideos();
                }).catch(error => {
                    this.showMsg('❌ Error', 'error');
                });
            },

            cancelEdit() {
                this.resetForm();
            },

            resetForm() {
                this.editingId = null;
                this.captionsData = null;
                document.getElementById('formTitle').textContent = 'नया वीडियो जोड़ें';
                document.getElementById('videoTitle').value = '';
                document.getElementById('youtubeUrl').value = '';
                document.getElementById('captionsFile').value = '';
                document.getElementById('fileStatus').textContent = '';
                document.getElementById('submitBtn').textContent = 'वीडियो जोड़ें';
                document.getElementById('cancelBtn').style.display = 'none';
            },

            loadAdminVideos() {
                const list = document.getElementById('videosList2');
                const empty = document.getElementById('emptyVideos');
                
                if (this.videos.length === 0) {
                    list.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }

                empty.style.display = 'none';
                list.innerHTML = this.videos.map(v => `
                    <div class="video-item">
                        <div class="video-item-title">${v.title}</div>
                        <div class="video-item-actions">
                            <button class="btn-small btn-edit" onclick="app.editVideo('${v.id}')">संपादित करें</button>
                            <button class="btn-small btn-delete" onclick="app.deleteVideo('${v.id}')">हटाएं</button>
                        </div>
                    </div>
                `).join('');
            },

            loadVideos() {
                const loading = document.getElementById('loadingState');
                const empty = document.getElementById('emptyState');
                const error = document.getElementById('errorState');
                const list = document.getElementById('videosList');

                loading.style.display = 'flex';
                empty.style.display = 'none';
                error.style.display = 'none';
                list.innerHTML = '';

                this.loadTimeout = setTimeout(() => {
                    loading.style.display = 'none';
                    error.style.display = 'flex';
                    document.getElementById('errorMsg').textContent = 'Firebase लोड नहीं हो रहा। इंटरनेट चेक करें।';
                }, 8000);

                db.ref('videos').once('value', (snapshot) => {
                    clearTimeout(this.loadTimeout);
                    loading.style.display = 'none';

                    this.videos = [];
                    snapshot.forEach(child => {
                        this.videos.push({ id: child.key, ...child.val() });
                    });

                    if (this.videos.length === 0) {
                        empty.style.display = 'block';
                        list.innerHTML = '';
                    } else {
                        empty.style.display = 'none';
                        this.renderVideos();
                    }
                }).catch((err) => {
                    clearTimeout(this.loadTimeout);
                    loading.style.display = 'none';
                    error.style.display = 'flex';
                    document.getElementById('errorMsg').textContent = 'Firebase Error: ' + err.message;
                });
            },

            renderVideos() {
                const list = document.getElementById('videosList');
                list.innerHTML = this.videos.map(v => `
                    <div class="video-card" onclick="app.playVideo('${v.id}')">
                        <div class="video-thumbnail">
                            <img src="${v.thumbnail}" alt="${v.title}" onerror="this.style.display='none'">
                            <div class="play-icon">▶</div>
                        </div>
                        <div class="video-info">
                            <div class="video-title">${v.title}</div>
                        </div>
                    </div>
                `).join('');
            },

            playVideo(id) {
                const video = this.videos.find(v => v.id === id);
                if (!video) return;
                
                document.getElementById('playerTitle').textContent = video.title;
                document.getElementById('ytPlayer').src = `https://www.youtube.com/embed/${video.videoId}?autoplay=1`;
                this.showScreen('playerScreen');
            },

            extractVideoId(url) {
                try {
                    const u = new URL(url);
                    if (u.hostname.includes('youtu.be')) {
                        return u.pathname.substring(1).split('?')[0];
                    } else if (u.hostname.includes('youtube.com')) {
                        return u.searchParams.get('v');
                    }
                } catch (error) {
                    return null;
                }
                return null;
            },

            showMsg(msg, type) {
                const msgEl = document.getElementById('adminMsg');
                msgEl.innerHTML = `<div class="message ${type}">${msg}</div>`;
                setTimeout(() => msgEl.innerHTML = '', 3000);
            }
        };

        app.init();
    </script>
</body>
</html>
